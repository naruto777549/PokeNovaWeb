<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeNova Dashboard</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>PokeNova Dashboard</h1>
            <p>Live Trainer Data & Inventory</p>
        </header>

        <main>
            <div class="card">
                <h3>Trainer Stats</h3>
                <div class="stat-row">
                    <span>Heavyballs:</span>
                    <span class="stat-value" id="heavyballs">--</span>
                </div>
                <div class="stat-row">
                    <span>Moonballs:</span>
                    <span class="stat-value" id="moonballs">--</span>
                </div>
                <div class="stat-row">
                    <span>Loveballs:</span>
                    <span class="stat-value" id="loveballs">--</span>
                </div>
            </div>
        </main>
    </div>

    <!-- JS File Link -->
    <script src="home.js"></script>
</body>
</html>
