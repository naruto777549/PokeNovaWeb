<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading PokeNova...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
        }
        h1 {
            color: #f39c12;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>PokeNova Web</h1>
    <div class="spinner"></div>
    <p>Syncing with Database...</p>

    <script>
        // 2.5 seconds ke baad home.html par redirect karega
        setTimeout(() => {
            window.location.href = "home.html";
        }, 2500);
    </script>
</body>
</html>
