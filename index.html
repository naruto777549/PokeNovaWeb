<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeNova - Initializing</title>
    
    <!-- Premium Geometric Font (Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        /* Pure Black Background */
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        /* Logo Styling */
        .logo {
            width: 140px; /* Size adjust karne ke liye ise change karein */
            height: auto;
            margin-bottom: 25px;
            border-radius: 50%; /* Agar image ko circle banana ho to ye active rakhein */
        }

        /* Main Title */
        h1 {
            font-size: 34px;
            font-weight: 500;
            letter-spacing: 12px;
            margin-right: -12px; /* Centers text despite letter-spacing */
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* Subtitle */
        .subtitle {
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 6px;
            color: #cccccc;
            text-transform: uppercase;
            margin-bottom: 80px; /* Text aur bar ke beech ka gap */
        }

        /* Loading Data Row */
        .loading-info {
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Progress Bar Container */
        .progress-track {
            width: 260px; /* Bar ki length */
            height: 3px;  /* Bar ki thickness */
            background-color: #2a2a2a; /* Dark Grey background */
        }

        /* Progress Bar Red Fill */
        .progress-fill {
            height: 100%;
            width: 1%;
            background-color: #ff0000; /* Pure Red */
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <!-- Updated Logo Image Link -->
    <img src="https://files.catbox.moe/eyegb0.jpg" alt="PokeNova Logo" class="logo">
    
    <!-- Texts -->
    <h1>POKENOVA</h1>
    <p class="subtitle">Enter the next realm</p>
    
    <!-- Loading Percentage -->
    <div class="loading-info">
        INITIALIZING SYSTEM &nbsp;•&nbsp; <span id="percent-text">1</span>%
    </div>
    
    <!-- Progress Line -->
    <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let percent = 1;
            const percentText = document.getElementById("percent-text");
            const progressBar = document.getElementById("progress-bar");

            // 1% se 100% tak badhne ki speed (30ms)
            const loadingInterval = setInterval(() => {
                percent++;
                percentText.textContent = percent;
                progressBar.style.width = percent + "%";

                if (percent >= 100) {
                    clearInterval(loadingInterval);
                    
                    // 100% hone ke aadha second baad redirect
                    setTimeout(() => {
                        window.location.href = "pages/home.html";
                    }, 500); 
                }
            }, 30); 
        });
    </script>
</body>
</html>
